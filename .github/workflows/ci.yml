name: GENESIS CORE CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,web]"
      - name: Check Studio JavaScript syntax
        run: node --check src/genesis_core/static/studio/studio.js
      - name: Run tests
        run: pytest -q
