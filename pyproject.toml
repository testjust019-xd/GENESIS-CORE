[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "genesis-core"
version = "0.1.0.dev0"
description = "A local-first evolution and agent framework for language models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GENESIS CORE contributors" }]
dependencies = []

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
hardware = ["psutil>=5.9"]
documents = ["pypdf>=5"]
pro = ["prompt_toolkit>=3.0"]
dev = ["pytest>=8", "ruff>=0.5", "prompt_toolkit>=3.0"]

[project.scripts]
genesis = "genesis_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
